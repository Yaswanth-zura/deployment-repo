services:

  offers:
    image: 663566123253.dkr.ecr.ap-south-2.amazonaws.com/offers:${OFFERS_TAG}
    container_name: offers
    ports:
      - "1001:1001"
    networks:
      - micro-net

  shoes:
    image: 663566123253.dkr.ecr.ap-south-2.amazonaws.com/shoes:${SHOES_TAG}
    container_name: shoes
    ports:
      - "1002:1002"
    networks:
      - micro-net

  wishlist:
    image: 663566123253.dkr.ecr.ap-south-2.amazonaws.com/wishlist:${WISHLIST_TAG}
    container_name: wishlist
    ports:
      - "1003:1003"
    networks:
      - micro-net

  cart:
    image: 663566123253.dkr.ecr.ap-south-2.amazonaws.com/cart:${CART_TAG}
    container_name: cart
    ports:
      - "1004:1004"
    networks:
      - micro-net

  zuul:
    image: 663566123253.dkr.ecr.ap-south-2.amazonaws.com/zuul:${ZUUL_TAG}
    container_name: zuul
    ports:
      - "9999:9999"
    depends_on:
      - offers
      - shoes
      - wishlist
      - cart
    networks:
      - micro-net

  ui:
    image: 663566123253.dkr.ecr.ap-south-2.amazonaws.com/ui:${UI_TAG}
    container_name: ui
    ports:
      - "8080:8080"
    depends_on:
      - zuul
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      WDS_SOCKET_PORT: 8080
    networks:
      - micro-net

networks:
  micro-net:
    external: true